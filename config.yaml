# Morpheus v2 — Kalshi trading bot
# ~$6.56 capital (2 accounts), same-day markets only

strategy:
  enabled_strategies: ["kalshi_llm", "kalshi_mm", "kalshi_bracket_arb", "kalshi_bonding", "kalshi_cross_arb", "kalshi_crypto"]  # Wave 32: added cross_arb + re-enabled crypto (latency arb)
  min_edge: 0.05                    # 5% minimum edge (aligned with ensemble defaults)
  kelly_fraction: 0.50              # half-Kelly (was third)
  max_position_pct: 0.08            # 8% of bankroll cap (was 5%)
  max_position_size: 8.0            # $8 max (was $3)
  index_max_position_size: 20.0     # Wave 27.2: $20 max for index (9W/0L +$107.67, best performer)
  index_kelly_fraction: 0.60        # Wave 27.2: 60% Kelly for index (was 0.50) — proven 100% WR
  max_total_exposure: 25.0          # $25 max exposure (was $10)
  min_confidence: 0.3
  min_conviction: "low"             # allow all positive-edge trades (was "medium")
  high_conviction_multiplier: 1.3
  min_payout_ratio: 0.12
  fee_pct: 0.004                    # ~0.4% avg maker fee (0.0175 * P * (1-P))
  slippage_pct: 0.005

# Market filters — loosened for volume
market_filters:
  min_volume_24h: 1000              # raised (was 500) — only liquid markets
  min_price: 0.12                   # Wave 33: raised (was 0.10) — contracts <10c lose 60%+ (Whelan 300K study)
  max_price: 0.90
  min_liquidity: 500                # raised (was 200) — better fill rates
  min_liquidity_aggressive: 500
  max_spread_pct: 0.10              # relaxed — 8c at 90c mid = 8.4%, need headroom
  min_data_sources: 0               # no data source requirement
  exclude_closing_within_hours: 0   # trade right up to close
  max_markets_per_scan: 200
  max_resolution_days: 1            # SAME DAY ONLY
  price_move_alert_pct: 0.05
  max_per_correlation_cluster: 2
  focus_enabled: false
  max_14d_allocation_pct: 0.0
  max_7d_allocation_pct: 0.0

# Sports — still blocked
sports_filters:
  enabled: true
  blocked_categories:
    - "Sports"
    - "Soccer"
    - "Football"
    - "Basketball"
    - "Baseball"
    - "Hockey"
    - "Tennis"
    - "Golf"
    - "MMA"
    - "Boxing"
    - "Racing"
  blocked_patterns:
    - "Winner"
    - "vs"
    - "TIE"
    - "DRAW"
    - "Underdog"
    - "to Win"
    - "to Beat"
    - "Advance"
    - "Champion"
    - "MVP"
    - "Gold Medal"
  allowed_live_only: true
  allowed_patterns:
    - "red card"
    - "injury"
    - "ejection"

# LLM — ensemble mode
llm:
  model: "gpt-4o"
  ensemble_anthropic_model: "claude-sonnet-4-20250514"
  ensemble_mode: "full"             # Wave 23: 5-model trimmed mean ensemble
  ensemble_models:
    - {provider: "openai", model: "gpt-4o", enabled: true}
    - {provider: "anthropic", model: "claude-sonnet-4-20250514", enabled: true}
    - {provider: "mistral", model: "mistral-small-latest", enabled: true}
    - {provider: "deepseek", model: "deepseek-chat", enabled: true}
    - {provider: "gemini", model: "gemini-2.5-flash-preview-05-20", enabled: true}
  temperature: 0.1
  max_tokens: 1000
  timeout_seconds: 30
  screening_enabled: true
  screening_model: "gpt-4o-mini"
  cache_enabled: true
  cache_ttl_minutes: 60             # shorter cache for same-day
  calibration_enabled: true
  calibration_floor: 0.05
  calibration_ceiling: 0.95
  calibration_shrink_strength: 0.03  # Wave 25: reduced from 0.15 — Platt handles calibration now
  consensus_enabled: false           # replaced by ensemble
  monthly_budget_usd: 15.0
  daily_budget_usd: 0.50             # Wave 28: reduced from $3 — NOAA fast-path is free, LLM ensemble has no proven edge
  require_data_sources: false
  min_data_sources: 0

news:
  sources:
    - name: "google_news"
      url: "https://news.google.com/rss/search"
      enabled: true
  max_articles_per_query: 5
  article_age_hours: 24             # shorter for same-day
  rate_limit_seconds: 1
  fetch_full_articles: true
  max_article_chars: 1500

# Risk — tuned for $100/account
risk:
  max_loss_per_trade: 4.0           # $4 max loss per trade (was $2)
  max_daily_loss: 6.0               # $6 daily loss limit (was $3)
  stop_loss_pct: 0.35               # 35% stop loss (was 25%)
  take_profit_pct: 0.60             # 60% take profit — let winners run in binary markets
  max_position_hold_hours: 24       # same-day (was 168)
  position_check_interval_minutes: 5
  cooldown_minutes: 15              # shorter cooldown
  prevent_retrade: true
  use_quarter_kelly: false          # using third-Kelly now
  max_bankroll_pct: 0.20            # 20% per trade (was 15%)
  weather_repricing_enabled: true
  weather_exit_threshold: -0.05     # exit when edge drops to -5%
  weather_exit_threshold_high_conf: -0.03  # tighter exit for high-confidence NOAA signals

timing:
  loop_interval_seconds: 60
  market_scan_interval_minutes: 10  # more frequent (was 30)
  signal_refresh_interval_minutes: 30
  portfolio_update_interval_minutes: 5
  rate_limit_per_minute: 30
  resolution_check_interval_minutes: 15

logging:
  level: "INFO"
  format: "json"
  file: "morpheus.log"
  max_file_size_mb: 100
  backup_count: 5

orchestrator:
  enabled: true
  signal_ttl_seconds: 300
  max_signals_per_cycle: 12         # Wave 27: raised — bracket arb needs 4 signals per set, was starving other engines
  multi_engine_boost: 1.5
  cycle_interval_seconds: 60
  liquidate_on_startup: false       # Only use for one-time manual cleanup

# Kalshi — primary platform
kalshi:
  enabled: true
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  scan_interval_seconds: 600        # 10 min scans (budget-friendly)
  fee_per_contract: 0.00            # no flat fee — maker fees modeled via strategy.fee_pct (0.0175*P*(1-P))
  min_volume: 1000                  # lowered — match market_filters threshold
  max_position_contracts: 50
  categories:
    - "Politics"
    - "Economics"
    - "Elections"
    - "Climate and Weather"
    - "Science and Technology"
    - "Companies"
    - "Financials"
  max_resolution_days: 1            # same-day only
  max_spread_pct: 0.10              # matches market_filters

# Survival mode — self-sustainability gate
survival:
  enabled: true
  vps_cost_daily: 0.33
  reduced_window_days: 7
  halted_window_days: 14
  reduced_multiplier: 0.5
  grace_period_days: 7

# Contrarian strategy — bet against overconfident crowds
contrarian:
  enabled: false  # Wave 29: removed from enabled_strategies in Wave 28, disable config
  scan_interval_seconds: 600    # 10 min scans
  min_crowd_confidence: 0.80    # market must be 80%+ one side
  max_crowd_confidence: 0.95    # don't bet against 95%+ (usually right)
  min_contrarian_edge: 0.10     # LLM must disagree by 10%+
  min_conviction: "low"         # was "medium" — too restrictive for contrarian plays
  max_position_size: 4.0        # $4 per contrarian trade
  max_total_exposure: 8.0       # $8 total contrarian exposure
  max_resolution_days: 7        # 1-7 day markets (not just same-day)
  min_volume_24h: 500           # lowered — small bets fill on thin markets
  categories:
    - "Politics"
    - "Economics"
    - "Elections"
    - "Climate and Weather"
    - "Science and Technology"
    - "Companies"
    - "Financials"

# Market Making — low maker fees (0.0175 * C * P * (1-P))
market_making:
  enabled: true
  max_markets: 8                    # Wave 32: 8 (was 3) — scale up after capital frees
  min_volume: 2000                  # Wave 33: 2000 (was 500) — stop churning on dead markets (3886 orders, 2 fills on KXTRUMPSAY)
  min_spread_cents: 3               # 3c minimum spread to capture
  max_spread_cents: 15              # avoid illiquid markets
  quote_size: 5                     # Wave 32: 5 (was 2) — more contracts per side
  max_inventory: 25                 # Wave 32: 25 (was 10) — scale with more markets
  max_inventory_usd: 5.0            # $5 max exposure per market
  inventory_skew_cents: 3           # Wave 28: 3c skew (was 2) — widen when one-sided
  quote_refresh_seconds: 15         # Wave 32: 15s (was 30) — faster requoting
  scan_interval_seconds: 300        # rescan markets every 5 min
  min_price_cents: 15               # only MM in 15-85 range
  max_price_cents: 85
  avellaneda_stoikov:
    gamma: 0.3                        # risk aversion (0.1 aggressive, 0.5 conservative)
    default_sigma: 0.15               # volatility fallback when no trade history
    min_spread_cents: 2               # never quote tighter than 2c
    max_spread_cents: 15              # never quote wider than 15c

# 15-minute crypto engine — Wave 32: latency arbitrage on KXBTC15M
# Exploits 30-90s price lag between Coinbase real-time and Kalshi orderbook
crypto_engine:
  enabled: true                     # Wave 32: re-enabled with latency_arb mode
  mode: "latency_arb"              # NEW: was "llm_prediction" — follow confirmed momentum
  scan_interval_seconds: 60         # rescan for new windows every 60s
  signal_interval_seconds: 15       # check momentum every 15s
  momentum_threshold_pct: 0.15      # 0.15% confirmed move triggers signal
  confirmation_window_seconds: 120  # check price change over last 2 min
  min_elapsed_minutes: 2            # Wave 32: 2 min (was 3) — latency arb benefits from earlier entry
  max_elapsed_minutes: 10           # don't signal too late in window
  max_position_usd: 5.0             # $5 max per trade
  min_confidence: 0.50              # Wave 32: raised from 0.45 — need confirmed direction
  cooldown_per_window_seconds: 120  # only 1 signal per window per 2 min
  maker_fee_coefficient: 0.0175     # Kalshi maker fee formula coefficient
  ws_url: "wss://ws-feed.exchange.coinbase.com"  # Coinbase (US-friendly)
  ticker_prefix: "KXBTC15M"

# Bracket arbitrage scanner — risk-free profit from mispriced bracket sets
bracket_arb:
  enabled: true
  scan_interval_seconds: 15         # Wave 32: 15s (was 60) — catch brief mispricings faster
  min_margin_pct: 1.5              # Wave 27: 1.5% — zero fees means thin margins work
  max_active_sets: 5               # Wave 28: 5 (was 3) — more concurrent arbs with fresh capital
  max_days_to_close: 5             # Wave 27: 5 days — more brackets in scope
  min_brackets: 6                  # Wave 28.1: 6 (was 3) — weather events have 7-12, 4-bracket sets are always incomplete
  max_contracts_per_leg: 3         # Wave 32: 3 (was 1) — scale up per leg
  max_total_arb_usd: 15.0          # Wave 32: $15 (was $5) — scale up after capital frees

# CLV tracking
clv_tracking:
  enabled: true
  check_interval_minutes: 60
  alert_threshold: -0.02
  halt_threshold: -0.03
  min_samples: 30
  per_type_tracking: true
  per_type_halt_threshold: -0.03

# Alerts — Telegram
alerts:
  telegram_enabled: true
  alert_on_trade: true
  alert_on_profit: true
  alert_on_exit: true
  alert_on_error: true
  daily_summary: true
  daily_summary_hour: 23            # 11 PM UTC

# Theta decay engine — time-decay seller near market close
theta_engine:
  enabled: false  # Wave 29: disabled since Wave 22, match config to reality
  scan_interval_seconds: 300       # scan every 5 minutes
  max_hours_to_close: 2.0          # only markets closing within 2 hours
  min_hours_to_close: 0.05         # ~3 min floor (avoid settled markets)
  fav_min_price: 0.80              # favorite lower bound
  fav_max_price: 0.92              # favorite upper bound
  fav_min_edge: 0.03               # 3% minimum edge for favorites
  long_min_price: 0.05             # longshot lower bound
  long_max_price: 0.15             # longshot upper bound
  long_min_edge: 0.05              # 5% minimum edge for longshots
  max_per_trade_usd: 3.0           # conservative $3 max per trade
  max_theta_positions: 5           # max 5 simultaneous theta positions
  min_volume: 200                  # lower volume bar near close

# Economic data release sniping (CPI/jobs/GDP fast-path on release days)
econ_sniping:
  enabled: true
  min_edge: 0.05                   # 5% minimum edge for econ signals
  min_z_score: 1.0                 # only signal on 1+ sigma surprises
  release_window_hours: 2          # check within 2 hours after scheduled release

# Wave 23: per-type calibration knobs (previously hardcoded)
calibration:
  default_platt_alpha: 0.68        # Platt scaling alpha (0.68 fitted to our data)
  weather_platt_alpha: 0.83        # less compression for data-backed weather
  weather_extreme_platt_alpha: 0.95 # near-passthrough for extreme data (FAR ABOVE/BELOW)
  weather_strong_platt_alpha: 0.90  # mild compression for strong data (well above/below)
  index_platt_alpha: 0.85          # index markets: 9W/0L, trust signals more
  index_shrink: 0.08               # less shrinkage for proven index signals
  weather_shrink: 0.12             # moderate shrinkage for weather
  default_shrink: 0.03             # Wave 25: reduced — Platt handles calibration
  edge_cap: 0.30                   # edges >0.30 are unreliable (0% WR in data)
  per_type:
    index:
      platt_alpha: 0.90            # Wave 27.2: higher alpha = less compression (9W/0L track record)
      extra_shrink: -0.05          # LESS shrinkage (index 9W/0L)
      kelly_boost: 1.0             # no penalty (already using index_kelly_fraction)
    weather:
      platt_alpha: 0.83
      extra_shrink: 0.0
      kelly_boost: 1.0
    politics:
      platt_alpha: 0.68
      extra_shrink: 0.12           # Wave 25: LLMs worst at politics (ECE=0.40 per KalshiBench)
      kelly_boost: 0.50            # Wave 25: quarter-Kelly for politics (was 0.80)
    economics:
      platt_alpha: 0.75
      extra_shrink: 0.08           # Wave 25: economics also overconfident
      kelly_boost: 0.70            # Wave 25: reduced from 1.0

# Wave 23: high-probability bonding scanner
bonding:
  enabled: true
  scan_interval_seconds: 120        # Wave 32: 120s (was 600) — faster scanning
  min_price_cents: 90              # minimum YES price to consider
  max_price_cents: 98              # don't buy 99c (1c profit = below fees)
  max_hours_to_settle: 72          # within 3 days
  min_volume: 500                  # Wave 28.1: 500 (was 2000) — bonding holds to settlement, doesn't need sell liquidity
  max_position_usd: 15.0           # Wave 32: $15 (was $10) — scale up per bond
  max_total_bonds: 10              # Wave 32: 10 (was 5) — more simultaneous bonds
  min_profit_pct: 0.02             # 2% minimum profit (covers fees)
  verify_with_data: true           # use NOAA/Yahoo to verify near-certainty

# Wave 32: Cross-platform arbitrage — Polymarket price signals for Kalshi trades
# Reads public Polymarket CLOB API prices, compares to Kalshi orderbooks.
# When same event diverges > threshold, trade Kalshi side.
cross_arb:
  enabled: true
  scan_interval_seconds: 30          # check every 30s for price divergence
  min_divergence_pct: 3.0            # 3% after fees (Kalshi maker = 0, Poly = 2% on winnings)
  max_position_usd: 10.0             # $10 max per cross-arb trade
  polymarket_api_url: "https://clob.polymarket.com"
  pair_cache_file: "state/cross_arb_pairs.json"
  pair_refresh_seconds: 3600         # refresh pair mappings every hour
  signal_cooldown_seconds: 300       # 5 min cooldown per ticker after signal

# Wave 27.2: Longshot seller — exploit favorite-longshot bias
# Markets priced YES < 12c resolve YES far less than implied (2-4% vs 5-12%)
# Buying NO captures the systematic overpricing of unlikely outcomes
longshot_seller:
  enabled: false  # Wave 29: never fills, wasted compute
  scan_interval_seconds: 600       # 10 min scans
  max_yes_cents: 12                # only sell longshots where YES <= 12c
  min_yes_cents: 2                 # skip dust (1c = essentially settled)
  min_volume: 1000                 # need liquidity for fills
  min_hours_to_close: 4.0          # don't sell near expiry (execution risk)
  max_days_to_close: 7             # 1-7 day markets
  max_positions: 5                 # max 5 longshot sells active
  max_per_trade_usd: 2.0           # conservative $2 per trade
  min_profit_pct: 0.03             # 3% minimum return per trade

# Compatibility
bregman_arb: {}

dev:
  dry_run: false
  paper_trading_balance: 200.0
  enable_debug_logs: false
