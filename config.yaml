# Morpheus — Stripped to what works.
# Two engines: LLM predictions + Event-group arbitrage.
# Maker orders only (0% fee). That's it.

polymarket:
  clob_url: "https://clob.polymarket.com"
  gamma_url: "https://gamma-api.polymarket.com"
  chain_id: 137
  signature_type: 0  # 0 = EOA (MetaMask/hardware wallet)

# Core strategies + copy trading for specific wallets
strategy:
  enabled_strategies: ["kalshi_llm"]
  min_edge: 0.05
  kelly_fraction: 0.5
  max_position_size: 5000.0
  max_total_exposure: 25000.0
  min_confidence: 0.5
  min_conviction: "low"             # net_edge >= 0.02
  high_conviction_multiplier: 2.0
  min_payout_ratio: 0.15
  fee_pct: 0.00                     # maker orders = 0% fee
  slippage_pct: 0.005

# Market filters
market_filters:
  min_volume_24h: 5000.0
  min_price: 0.03
  max_price: 0.97
  min_liquidity: 500.0
  min_liquidity_aggressive: 500.0
  exclude_closing_within_hours: 6
  max_markets_per_scan: 200
  max_resolution_days: 7
  price_move_alert_pct: 0.05
  max_per_correlation_cluster: 1
  focus_enabled: false

# LLM — two-tier screening saves money, calibration + NO-bias are the edge
llm:
  model: "gpt-4o"
  temperature: 0.1
  max_tokens: 1000
  timeout_seconds: 30
  screening_enabled: true
  screening_model: "gpt-4o-mini"
  cache_enabled: true
  cache_ttl_minutes: 120
  calibration_enabled: true
  calibration_floor: 0.05
  calibration_ceiling: 0.95
  calibration_shrink_strength: 0.15
  consensus_enabled: false
  monthly_budget_usd: 100.0

# News for LLM context
news:
  sources:
    - name: "google_news"
      url: "https://news.google.com/rss/search"
      enabled: true
  max_articles_per_query: 5
  article_age_hours: 24
  rate_limit_seconds: 1
  fetch_full_articles: true
  max_article_chars: 500

# Risk
risk:
  max_loss_per_trade: 500.0
  max_daily_loss: 2000.0
  stop_loss_pct: 0.15
  take_profit_pct: 0.30
  max_position_hold_hours: 168
  position_check_interval_minutes: 30
  cooldown_minutes: 60
  prevent_retrade: true

# Timing
timing:
  loop_interval_seconds: 120
  market_scan_interval_minutes: 30
  signal_refresh_interval_minutes: 120
  portfolio_update_interval_minutes: 5
  rate_limit_per_minute: 30
  resolution_check_interval_minutes: 30

logging:
  level: "INFO"
  format: "json"
  file: "polymarket_bot.log"
  max_file_size_mb: 100
  backup_count: 5

# Orchestrator — simplified, slower cycle
orchestrator:
  enabled: true
  signal_ttl_seconds: 300
  max_signals_per_cycle: 10
  multi_engine_boost: 1.0            # disabled — no consensus to boost
  cycle_interval_seconds: 30         # was 1s, now 30s (engines update every 30-60s anyway)

# Execution — maker orders, 0% fees
execution:
  default_slippage: 0.005
  fee_bps: 0.0
  order_timeout_seconds: 60
  max_retries: 3
  retry_delay_seconds: 2
  prefer_limit_orders: true
  maker_spread_offset: 0.005
  urgent_allow_taker: true
  limit_order_timeout_seconds: 30

# Bregman arb — L2 event-group only (L1 rare, L3 broken)
bregman_arb:
  enabled: true
  scan_interval_seconds: 300
  cross_market_scan_interval: 999999  # effectively disabled — L3 doesn't work
  min_profit_threshold: 0.02
  min_profit_usd: 5.0
  max_position_usd: 100.0
  taker_fee: 0.02

# Everything below: disabled
websocket:
  enabled: false

spike_detection:
  enabled: false

copy_trading:
  enabled: true
  poll_interval_seconds: 30
  min_trade_size_usd: 50
  max_copy_size_usd: 25
  copy_ratio: 0.1
  max_masters: 1
  master_wallets:
    - "0xd830027529b0baca2a52fd8a4dee43d366a9a592"
  watchlist_file: "state/copy_watchlist.json"
  trade_history_file: "state/copy_trades.jsonl"

kalshi:
  enabled: true
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  scan_interval_seconds: 900
  fee_per_contract: 0.07
  min_volume: 50
  max_position_contracts: 100
  categories: ["Politics", "Economics", "Elections", "World", "Climate and Weather", "Financials", "Science and Technology", "Entertainment", "Companies", "Social"]
  max_resolution_days: 30

arbitrage:
  enabled: false

dev:
  dry_run: false
  paper_trading_balance: 10000.0
  enable_debug_logs: false
